name: Build

on:
  # main is built by the release workflow, against the tag.
  push:
    branches: [develop]
  pull_request:
    branches: [main, develop]
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read

# Pinned rather than ubuntu-latest: with -warnaserror, a runner upgrade must not break the build.
jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Setup .NET
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 10.0.x

      - name: Restore
        run: dotnet restore Jellyfin.Plugin.LanguageFailover.sln

      - name: Build
        run: dotnet build Jellyfin.Plugin.LanguageFailover.sln --configuration Release --no-restore -warnaserror

      - name: Test
        run: dotnet test Jellyfin.Plugin.LanguageFailover.sln --configuration Release --no-build --verbosity normal

      - name: Stage the plugin build
        run: |
          mkdir -p plugin-build
          cp Jellyfin.Plugin.LanguageFailover/bin/Release/net10.0/Jellyfin.Plugin.LanguageFailover.dll plugin-build/
          cp Jellyfin.Plugin.LanguageFailover/meta.json plugin-build/
          cp "images/$(jq -r '.imagePath' Jellyfin.Plugin.LanguageFailover/meta.json)" plugin-build/

      - name: Upload the plugin build
        uses: actions/upload-artifact@v7
        with:
          name: plugin-build
          path: plugin-build/
          if-no-files-found: error
          retention-days: 14

  web-tests:
    name: Config page tests
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: 24

      - name: Install
        run: npm ci
        working-directory: web-tests

      - name: Test
        run: npm test
        working-directory: web-tests
