name: Build

on:
  # Not on pushes to main: main only moves to receive a merge that is about to be
  # tagged, and the release workflow builds and tests the tag before it packages or
  # publishes anything. Building the merge as well would just run the same commit
  # twice, seconds apart.
  push:
    branches: [develop]
  pull_request:
    branches: [main, develop]

# The runner image is pinned rather than left on ubuntu-latest, for the same reason the
# analyzer package is pinned in Directory.Build.props: with -warnaserror, a runner that
# rolls to a new Ubuntu on its own must not be able to break the build with no commit
# behind it. ubuntu-latest becomes Ubuntu 26 on 2026-10-19; move this deliberately.
jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup .NET
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 10.0.x

      - name: Restore
        run: dotnet restore Jellyfin.Plugin.LanguageFailover.sln

      - name: Build
        run: dotnet build Jellyfin.Plugin.LanguageFailover.sln --configuration Release --no-restore -warnaserror

      - name: Test
        run: dotnet test Jellyfin.Plugin.LanguageFailover.sln --configuration Release --no-build --verbosity normal

  web-tests:
    name: Config page tests
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: 24

      - name: Install
        run: npm ci
        working-directory: web-tests

      - name: Test
        run: npm test
        working-directory: web-tests
