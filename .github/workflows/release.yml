name: Release

on:
  push:
    tags:
      - 'v*.*.*.*'

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Verify tag is on main
        run: |
          git fetch origin main
          if ! git merge-base --is-ancestor "${{ github.sha }}" origin/main; then
            echo "Error: tag ${{ github.ref_name }} is not on the main branch"
            exit 1
          fi
          echo "Tag is on main — proceeding with release"

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 9.0.x

      - name: Read version and changelog from the tag
        id: meta
        env:
          TAG: ${{ github.ref_name }}
        run: |
          VERSION="${TAG#v}"

          # The annotated tag message is the release note. Fall back to the tagged
          # commit's message only for a lightweight tag, which has none.
          CHANGELOG="$(git tag -l --format='%(contents)' "$TAG")"
          if [ -z "$(printf '%s' "$CHANGELOG" | tr -d '[:space:]')" ]; then
            echo "Tag $TAG has no annotation; falling back to the commit message."
            CHANGELOG="$(git log -1 --pretty=%B "$TAG")"
          fi

          {
            echo "version=$VERSION"
            echo "timestamp=$(date -u +'%Y-%m-%dT%H:%M:%SZ')"
            echo "changelog<<CHANGELOG_EOF"
            printf '%s\n' "$CHANGELOG"
            echo "CHANGELOG_EOF"
          } >> "$GITHUB_OUTPUT"

          echo "Version: $VERSION"
          printf 'Changelog:\n%s\n' "$CHANGELOG"

      - name: Stamp meta.json for the packaged build
        env:
          VERSION: ${{ steps.meta.outputs.version }}
          TIMESTAMP: ${{ steps.meta.outputs.timestamp }}
          CHANGELOG: ${{ steps.meta.outputs.changelog }}
        run: python3 scripts/set_meta_version.py

      - name: Build and test
        run: |
          dotnet restore Jellyfin.Plugin.LanguageFailover.sln
          dotnet build Jellyfin.Plugin.LanguageFailover.sln \
            --configuration Release \
            --no-restore \
            -warnaserror \
            -p:Version=${{ steps.meta.outputs.version }}
          dotnet test Jellyfin.Plugin.LanguageFailover.sln --configuration Release --no-build

      - name: Package
        id: package
        env:
          VERSION: ${{ steps.meta.outputs.version }}
        run: |
          mkdir -p release
          cp Jellyfin.Plugin.LanguageFailover/bin/Release/net9.0/Jellyfin.Plugin.LanguageFailover.dll release/
          cp Jellyfin.Plugin.LanguageFailover/meta.json release/
          cd release
          ZIP_NAME="language-failover_${VERSION}.zip"
          zip "$ZIP_NAME" Jellyfin.Plugin.LanguageFailover.dll meta.json
          CHECKSUM=$(md5sum "$ZIP_NAME" | awk '{print $1}')
          {
            echo "zip_name=$ZIP_NAME"
            echo "checksum=$CHECKSUM"
          } >> "$GITHUB_OUTPUT"
          echo "Checksum: $CHECKSUM"

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: Language Failover ${{ steps.meta.outputs.version }}
          body: ${{ steps.meta.outputs.changelog }}
          files: release/${{ steps.package.outputs.zip_name }}
          draft: false
          prerelease: false

      - name: Update manifest.json and meta.json on main
        env:
          VERSION: ${{ steps.meta.outputs.version }}
          CHANGELOG: ${{ steps.meta.outputs.changelog }}
          TIMESTAMP: ${{ steps.meta.outputs.timestamp }}
          CHECKSUM: ${{ steps.package.outputs.checksum }}
          SOURCE_URL: https://github.com/${{ github.repository }}/releases/download/${{ github.ref_name }}/${{ steps.package.outputs.zip_name }}
        run: |
          # The stamped meta.json is already inside the published zip; regenerate it
          # on main rather than carrying the working-tree copy across the checkout.
          git restore Jellyfin.Plugin.LanguageFailover/meta.json
          git checkout main
          git pull origin main

          python3 scripts/set_meta_version.py
          python3 scripts/update_manifest.py

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add manifest.json Jellyfin.Plugin.LanguageFailover/meta.json
          if git diff --cached --quiet; then
            echo "No changes to commit"
          else
            git commit -m "Release ${VERSION}: update manifest and meta.json"
            git push origin main
          fi
