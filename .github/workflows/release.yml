name: Release

on:
  push:
    tags:
      - 'v*.*.*.*'

permissions: {}

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  prepare:
    name: Validate the tag
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    outputs:
      version: ${{ steps.meta.outputs.version }}
      timestamp: ${{ steps.meta.outputs.timestamp }}
      changelog: ${{ steps.meta.outputs.changelog }}
    steps:
      - name: Check the tag name
        run: |
          if [[ ! "$GITHUB_REF_NAME" =~ ^v[0-9]+\.[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::The tag must look like v1.4.0.0."
            exit 1
          fi

      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Verify the tag is on main
        run: |
          if ! git merge-base --is-ancestor "$GITHUB_SHA" origin/main; then
            echo "::error::Tag ${GITHUB_REF_NAME} is not on the main branch."
            exit 1
          fi

      - name: Read version and changelog from the tag
        id: meta
        run: |
          TAG="$GITHUB_REF_NAME"
          VERSION="${TAG#v}"

          git fetch --force origin "refs/tags/${TAG}:refs/tags/${TAG}"

          # The changelog is the tag message; a lightweight tag would fall back to the commit message.
          if [ "$(git cat-file -t "$TAG")" != "tag" ]; then
            echo "::error::Tag ${TAG} is lightweight, so it carries no release note."
            echo "Re-create it as an annotated tag, then push it again:"
            echo "    git tag -d ${TAG} && git push origin :refs/tags/${TAG}"
            echo "    git tag -a ${TAG} -F release-notes.md --cleanup=verbatim"
            echo "    git push origin ${TAG}"
            exit 1
          fi

          CHANGELOG="$(git tag -l --format='%(contents)' "$TAG")"
          if [ -z "$(printf '%s' "$CHANGELOG" | tr -d '[:space:]')" ]; then
            echo "::error::Tag ${TAG} is annotated but its message is empty."
            exit 1
          fi

          DELIMITER="CHANGELOG_$(openssl rand -hex 16)"
          {
            echo "version=$VERSION"
            echo "timestamp=$(date -u +'%Y-%m-%dT%H:%M:%SZ')"
            echo "changelog<<$DELIMITER"
            printf '%s\n' "$CHANGELOG"
            echo "$DELIMITER"
          } >> "$GITHUB_OUTPUT"

          echo "Version: $VERSION"
          printf 'Changelog:\n%s\n' "$CHANGELOG"

  tests:
    name: Tests
    needs: prepare
    permissions:
      contents: read
    uses: ./.github/workflows/build.yml

  package:
    name: Build the release zip
    needs: [prepare, tests]
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    outputs:
      zip_name: ${{ steps.package.outputs.zip_name }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Setup .NET
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 10.0.x

      - name: Stamp meta.json for the packaged build
        env:
          VERSION: ${{ needs.prepare.outputs.version }}
          TIMESTAMP: ${{ needs.prepare.outputs.timestamp }}
          CHANGELOG: ${{ needs.prepare.outputs.changelog }}
        run: python3 scripts/set_meta_version.py

      - name: Build
        env:
          VERSION: ${{ needs.prepare.outputs.version }}
        run: |
          dotnet restore Jellyfin.Plugin.LanguageFailover.sln
          dotnet build Jellyfin.Plugin.LanguageFailover.sln \
            --configuration Release \
            --no-restore \
            -warnaserror \
            "-p:Version=${VERSION}"

      - name: Package
        id: package
        env:
          VERSION: ${{ needs.prepare.outputs.version }}
        run: |
          mkdir -p release
          cp Jellyfin.Plugin.LanguageFailover/bin/Release/net10.0/Jellyfin.Plugin.LanguageFailover.dll release/
          cp Jellyfin.Plugin.LanguageFailover/meta.json release/
          IMAGE="$(jq -r '.imagePath' Jellyfin.Plugin.LanguageFailover/meta.json)"
          cp "images/${IMAGE}" release/
          cd release
          ZIP_NAME="language-failover_${VERSION}.zip"
          zip "$ZIP_NAME" Jellyfin.Plugin.LanguageFailover.dll meta.json "$IMAGE"
          echo "zip_name=$ZIP_NAME" >> "$GITHUB_OUTPUT"
          sha256sum "$ZIP_NAME"

      - name: Upload the release zip
        uses: actions/upload-artifact@v7
        with:
          name: release-zip
          path: release/${{ steps.package.outputs.zip_name }}
          if-no-files-found: error
          retention-days: 7

  publish:
    name: Publish
    needs: [prepare, package]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
      id-token: write
      attestations: write
    steps:
      - name: Checkout main
        uses: actions/checkout@v7
        with:
          ref: main
          persist-credentials: true

      - name: Download the release zip
        uses: actions/download-artifact@v8
        with:
          name: release-zip
          path: release

      - name: Attest build provenance
        uses: actions/attest-build-provenance@v4
        with:
          subject-path: release/${{ needs.package.outputs.zip_name }}

      - name: Create the GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          VERSION: ${{ needs.prepare.outputs.version }}
          CHANGELOG: ${{ needs.prepare.outputs.changelog }}
          ZIP_NAME: ${{ needs.package.outputs.zip_name }}
        run: |
          printf '%s\n' "$CHANGELOG" > "$RUNNER_TEMP/release-notes.md"
          gh release create "$GITHUB_REF_NAME" "release/${ZIP_NAME}" \
            --verify-tag \
            --title "Language Failover ${VERSION}" \
            --notes-file "$RUNNER_TEMP/release-notes.md"

      - name: Update manifest.json and meta.json on main
        env:
          VERSION: ${{ needs.prepare.outputs.version }}
          CHANGELOG: ${{ needs.prepare.outputs.changelog }}
          TIMESTAMP: ${{ needs.prepare.outputs.timestamp }}
          ZIP_NAME: ${{ needs.package.outputs.zip_name }}
        run: |
          CHECKSUM="$(md5sum "release/${ZIP_NAME}" | cut -d' ' -f1)"
          SOURCE_URL="${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/releases/download/${GITHUB_REF_NAME}/${ZIP_NAME}"
          export CHECKSUM SOURCE_URL

          python3 scripts/set_meta_version.py
          python3 scripts/update_manifest.py

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add manifest.json Jellyfin.Plugin.LanguageFailover/meta.json
          if git diff --cached --quiet; then
            echo "No changes to commit"
          else
            git commit -m "Release ${VERSION}: update manifest and meta.json"
            git push origin main
          fi
