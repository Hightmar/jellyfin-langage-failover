name: Workflow audit

on:
  push:
    branches: [main, develop]
    paths: ['.github/**']
  pull_request:
    paths: ['.github/**']
  workflow_dispatch:

permissions: {}

jobs:
  zizmor:
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Run zizmor
        env:
          GH_TOKEN: ${{ github.token }}
        run: pipx run --spec zizmor==1.32.0 zizmor --format=github .
